{{define "teacher-assignments-content"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - Post Assignment</title>
</head>
<body>
    <div class="container">
        <h2>Post New Assignment</h2>

        <form action="/api/teacher/assignments" method="POST">
            <div class="form-group">
                <label for="course_id">Course ID</label>
                <input type="number" id="course_id" name="course_id" required placeholder="e.g. 101">
            </div>

            <div class="form-group">
                <label for="teacher_id">Teacher ID</label>
                <input type="number" id="teacher_id" name="teacher_id" required placeholder="e.g. 5">
            </div>

            <div class="form-group">
                <label for="title">Assignment Title</label>
                <input type="text" id="title" name="title" required placeholder="Chapter 3 Homework">
            </div>

            <div class="form-group">
                <label for="description">Description & Instructions</label>
                <textarea id="description" name="description" rows="4" required placeholder="Provide clear task instructions..."></textarea>
            </div>

            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" required>
            </div>

            <button type="submit">Publish Assignment</button>
        </form>
        <a href="/dashboard" class="nav-link">Go back to dashboard</a>
    </div>
</body>
</html>
{{end}}
