<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Portal - Post Assignment</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Post New Assignment</h2>
        
        {{ if .Success }}
            <div class="alert success">Assignment posted successfully!</div>
        {{ end }}

        <form action="/api/teacher/assignments" method="POST">
            <div class="form-group">
                <label for="course_id">Course ID:</label>
                <input type="number" id="course_id" name="course_id" required>
            </div>

            <div class="form-group">
                <label for="teacher_id">Teacher ID:</label>
                <input type="number" id="teacher_id" name="teacher_id" required>
            </div>

            <div class="form-group">
                <label for="title">Assignment Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="description">Description & Instructions:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="due_date">Due Date:</label>
                <input type="date" id="due_date" name="due_date" required>
            </div>

            <button type="submit" class="btn">Publish Assignment</button>
        </form>
    </div>
</body>
</html>
