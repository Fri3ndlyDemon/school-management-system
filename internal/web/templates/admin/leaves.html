{{define "admin-leaves-content"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Teacher Leave Management</title>
</head>
<body>
    <div class="container">
        <h2>Log Teacher Leave</h2>
        <form action="/api/admin/leaves" method="POST">
            <div class="form-group">
                <label for="teacher_id">Teacher ID</label>
                <input type="number" id="teacher_id" name="teacher_id" required placeholder="e.g. 5">
            </div>
            <div class="form-group">
                <label for="start_date">Start Date</label>
                <input type="date" id="start_date" name="start_date" required>
            </div>
            <div class="form-group">
                <label for="end_date">End Date</label>
                <input type="date" id="end_date" name="end_date" required>
            </div>
            <div class="form-group">
                <label for="reason">Reason / Notes</label>
                <input type="text" id="reason" name="reason" placeholder="e.g. Medical leave">
            </div>
            <button type="submit">Submit Leave & Trigger Proxy Check</button>
        </form>
        <a href="/dashboard" class="nav-link">Go back to dashboard</a>
    </div>
</body>
</html>
{{end}}
